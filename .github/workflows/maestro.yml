name: Maestro Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-smoke:
    name: Smoke Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Sauce Labs Demo APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --repo saucelabs/my-demo-app-rn --pattern "Android-*.apk" --output demo-app.apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install demo-app.apk
            adb shell monkey -p com.saucelabs.mydemoapp.rn 1
            sleep 45
            adb shell input keyevent 3
            maestro test .maestro/flows/smoke/ --include-tags smoke --format junit --output maestro-smoke-report.xml -e EMAIL=bob@example.com -e PASSWORD=10203040

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-report
          path: |
            maestro-smoke-report.xml
            ~/.maestro/tests/

  android-regression:
    name: Regression Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: android-smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Sauce Labs Demo APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --repo saucelabs/my-demo-app-rn --pattern "Android-*.apk" --output demo-app.apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run regression tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install demo-app.apk
            adb shell monkey -p com.saucelabs.mydemoapp.rn 1
            sleep 45
            adb shell input keyevent 3
            maestro test .maestro/flows/regression/ --include-tags regression --format junit --output maestro-regression-report.xml -e EMAIL=bob@example.com -e PASSWORD=10203040

      - name: Upload regression test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-regression-report
          path: |
            maestro-regression-report.xml
            ~/.maestro/tests/

  ios-smoke:
    name: Smoke Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download Sauce Labs Demo iOS App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo saucelabs/my-demo-app-rn --pattern "iOS-Simulator-*.zip" --output demo-app.zip
          unzip demo-app.zip -d demo-app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]" | tail -1 | awk -F'[()]' '{print $2}')
          echo "Booting simulator: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          open -a Simulator
          sleep 15

      - name: Install and launch app
        run: |
          APP_PATH=$(find demo-app -name "*.app" | head -1)
          echo "Installing: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted com.saucelabs.mydemoapp.rn
          sleep 20

      - name: Run smoke tests on iOS simulator
        run: |
          maestro test .maestro/flows/smoke/ --include-tags smoke --format junit --output maestro-ios-smoke-report.xml -e EMAIL=bob@example.com -e PASSWORD=10203040

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-smoke-report
          path: |
            maestro-ios-smoke-report.xml
            ~/.maestro/tests/

  ios-regression:
    name: Regression Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: ios-smoke

    steps:
      - uses: actions/checkout@v4

      - name: Download Sauce Labs Demo iOS App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo saucelabs/my-demo-app-rn --pattern "iOS-Simulator-*.zip" --output demo-app.zip
          unzip demo-app.zip -d demo-app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]" | tail -1 | awk -F'[()]' '{print $2}')
          echo "Booting simulator: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          open -a Simulator
          sleep 15

      - name: Install and launch app
        run: |
          APP_PATH=$(find demo-app -name "*.app" | head -1)
          echo "Installing: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted com.saucelabs.mydemoapp.rn
          sleep 20

      - name: Run regression tests on iOS simulator
        run: |
          maestro test .maestro/flows/regression/ --include-tags regression --format junit --output maestro-ios-regression-report.xml -e EMAIL=bob@example.com -e PASSWORD=10203040

      - name: Upload regression test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-regression-report
          path: |
            maestro-ios-regression-report.xml
            ~/.maestro/tests/
