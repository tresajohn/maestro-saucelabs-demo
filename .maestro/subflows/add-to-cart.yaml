appId: com.saucelabs.mydemoapp.rn
---
- extendedWaitUntil:
    visible: "Sauce Labs Backpack"
    timeout: 20000
- tapOn: "Sauce Labs Backpack"
- runFlow:
    when:
      platform: "Android"
    commands:
      - tapOn: "Add To Cart button"
- runFlow:
    when:
      platform: "iOS"
    commands:
      - tapOn: "Add To Cart"
- takeScreenshot: item-added-to-cart
