appId: com.saucelabs.mydemoapp.rn
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sauce Labs Backpack"
    timeout: 60000
- runFlow:
    when:
      visible: "open menu"
    commands:
      - swipe:
          start: "0%, 50%"
          end: "60%, 50%"
          duration: 500
      - tapOn: "Log In"
- runFlow:
    when:
      visible: "Menu, tab, 3 of 3"
    commands:
      - tapOn: "Menu, tab, 3 of 3"
      - tapOn: "Log In"
- extendedWaitUntil:
    visible: "Username"
    timeout: 10000
- runFlow:
    when:
      platform: "Android"
    commands:
      - tapOn: "Username input field"
      - inputText: ${EMAIL}
      - tapOn: "Password input field"
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn: "Login button"
- runFlow:
    when:
      platform: "iOS"
    commands:
      - tapOn: "Username"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn: "Login"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sauce Labs Backpack"
    timeout: 30000
- takeScreenshot: post-login
