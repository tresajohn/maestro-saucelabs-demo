appId: com.saucelabs.mydemoapp.rn
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Products"
    timeout: 15000
- swipe:
    start: "0%, 50%"
    end: "60%, 50%"
    duration: 500
- tapOn: "Log In"
- tapOn: "Username"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Login"
- assertVisible: "Products"
- takeScreenshot: post-login
