appId: com.saucelabs.mydemoapp.rn
tags:
  - regression
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sauce Labs Backpack"
    timeout: 120000
- runFlow:
    when:
      visible: "open menu"
    commands:
      - swipe:
          start: "0%, 50%"
          end: "60%, 50%"
          duration: 500
      - tapOn: "Log In"
- runFlow:
    when:
      visible: "Menu, tab, 3 of 3"
    commands:
      - tapOn: "Menu, tab, 3 of 3"
      - tapOn: "Log In"
- extendedWaitUntil:
    visible: "Username"
    timeout: 10000
- runFlow:
    when:
      platform: "Android"
    commands:
      - tapOn: "Username input field"
      - inputText: "wrong@email.com"
      - tapOn: "Password input field"
      - inputText: "wrongpassword"
      - hideKeyboard
      - tapOn: "Login button"
- runFlow:
    when:
      platform: "iOS"
    commands:
      - tapOn:
          id: "bob@example.com-autofill"
      - tapOn:
          id: "Username input field"
      - eraseText
      - inputText: "wrong@email.com"
      - tapOn: "Select a username and password.*"
      - tapOn: 
          id: "Login button"
- assertVisible: "Provided credentials do not match any user in this service."
- takeScreenshot: regression-login-error
