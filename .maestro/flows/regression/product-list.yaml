appId: com.saucelabs.mydemoapp.rn
tags:
  - regression
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- assertVisible: "Sauce Labs Backpack"
- scrollUntilVisible:
    element:
      text: "Sauce Labs Onesie"
    direction: DOWN
    timeout: 15000
- assertVisible: "Sauce Labs Onesie"
- takeScreenshot: regression-scroll-to-last-item
- tapOn: "Sauce Labs Onesie"
- assertVisible: "Add To Cart button"
- takeScreenshot: regression-product-detail
