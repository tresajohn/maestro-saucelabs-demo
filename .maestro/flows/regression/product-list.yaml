appId: com.saucelabs.mydemoapp.rn
tags:
  - regression
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- assertVisible: "open menu"
- scrollUntilVisible:
    element:
      id: "store item"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "store item"
    index: 5
- assertVisible: "Add To Cart button"
- takeScreenshot: regression-product-detail
