appId: com.saucelabs.mydemoapp.rn
tags:
  - regression
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- assertVisible: "Sauce Labs Backpack"
- runFlow:
    when:
      platform: "Android"
    commands:
      - tapOn: "Suace Labs Backpack"
      - assertVisible: "Add To Cart button"
- runFlow:
    when:
      platform: "iOS"
    commands:
      - tapOn: "Suace Labs Backpack"
      - assertVisible: 
          id: "Add To Cart button"
- takeScreenshot: regression-product-detail
