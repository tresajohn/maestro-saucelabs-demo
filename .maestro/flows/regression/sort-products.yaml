appId: com.saucelabs.mydemoapp.rn
tags:
  - regression
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- assertVisible: "Products"
- takeScreenshot: regression-default-sort
- tapOn: "sort button"
- assertVisible: "Name - Ascending"
- tapOn: "Name - Descending"
- assertVisible: "Products"
- takeScreenshot: regression-sorted-descending
- tapOn: "sort button"
- tapOn: "Price - Ascending"
- assertVisible: "Products"
- takeScreenshot: regression-sorted-by-price
