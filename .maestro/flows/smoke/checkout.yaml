appId: com.saucelabs.mydemoapp.rn
tags:
  - smoke
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- runFlow: ../../subflows/dismiss-permissions.yaml
- runFlow: ../../subflows/add-to-cart.yaml

- tapOn: "1"
- assertVisible: "Proceed To Checkout"
- takeScreenshot: smoke-cart-contents
- tapOn: "Proceed To Checkout"

- assertVisible: "Enter a shipping address"
- tapOn: "Full Name"
- inputText: "Test User"
- hideKeyboard
- tapOn: "Address Line 1"
- inputText: "123 QA Street"
- hideKeyboard
- tapOn: "City"
- inputText: "Test City"
- hideKeyboard
- tapOn: "State/Region"
- inputText: "CA"
- hideKeyboard
- tapOn: "Zip Code"
- inputText: "12345"
- hideKeyboard
- tapOn: "Country"
- inputText: "USA"
- hideKeyboard
- tapOn: "To Payment"

- assertVisible: "Enter a payment method"
- tapOn: "Full Name"
- inputText: "Test User"
- hideKeyboard
- tapOn: "Card Number"
- inputText: "4111111111111111"
- hideKeyboard
- tapOn: "Expiration Date"
- inputText: "12/30"
- hideKeyboard
- tapOn: "Security Code"
- inputText: "123"
- hideKeyboard
- tapOn: "Review Order"

- assertVisible: "Review your order"
- takeScreenshot: smoke-order-review
- tapOn: "Place Order"
- assertVisible: "Thank you for your order"
- takeScreenshot: smoke-order-confirmed
