appId: com.saucelabs.mydemoapp.rn
tags:
  - smoke
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- swipe:
    start: "0%, 50%"
    end: "60%, 50%"
    duration: 500
- tapOn: "Log Out"
- tapOn: "Log Out"
- tapOn: "OK"
- assertVisible: "Username input field"
- takeScreenshot: smoke-logout-success
