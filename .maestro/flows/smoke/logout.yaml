appId: com.saucelabs.mydemoapp.rn
tags:
  - smoke
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- runFlow: ../../subflows/login.yaml
- runFlow:
    when:
      visible: "open menu"
    commands:
      - swipe:
          start: "0%, 50%"
          end: "60%, 50%"
          duration: 500
- runFlow:
    when:
      visible: "Menu, tab, 3 of 3"
    commands:
      - tapOn: "Menu, tab, 3 of 3"
- tapOn: "Log Out"
- tapOn: "Log Out"
- tapOn: "OK"
- assertVisible: "Username"
- takeScreenshot: smoke-logout-success
